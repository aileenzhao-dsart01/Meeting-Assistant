<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Assistant — Test Frontend</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto p-6">
    <header class="mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Meeting Assistant</h1>
      <p class="text-gray-500">Test frontend — record audio, view transcript &amp; summary</p>
    </header>

    <div class="grid gap-6">
      <!-- Step 1: Create Meeting -->
      <section class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold mb-4">1. Create Meeting</h2>
        <div class="flex gap-3">
          <input type="text" id="meetingTitle" value="Marketing Weekly Sync"
                 class="flex-1 border rounded px-3 py-2 text-sm" placeholder="Meeting title" />
          <button onclick="createMeeting()"
                  class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
            Create
          </button>
        </div>
        <p id="meetingResult" class="text-sm text-gray-500 mt-2"></p>
      </section>

      <!-- Step 2: Record Audio -->
      <section class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold mb-4">2. Record / Upload Audio</h2>
        <div class="flex gap-3 items-center">
          <button id="recordBtn" onclick="toggleRecording()"
                  class="bg-red-600 text-white px-4 py-2 rounded text-sm hover:bg-red-700 disabled:opacity-50">
            Start Recording
          </button>
          <span id="recordingStatus" class="text-sm text-gray-500">Not recording</span>
        </div>
        <div class="mt-3">
          <label class="text-sm text-gray-600">Or upload an audio file:</label>
          <input type="file" id="audioFile" accept="audio/*"
                 class="block mt-1 text-sm" />
          <button onclick="uploadAudio()"
                  class="mt-2 bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">
            Upload
          </button>
        </div>
        <p id="audioResult" class="text-sm text-gray-500 mt-2"></p>
      </section>

      <!-- Step 3: Process -->
      <section class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold mb-4">3. Process (Transcribe + Summarize)</h2>
        <button onclick="processMeeting()"
                class="bg-purple-600 text-white px-4 py-2 rounded text-sm hover:bg-purple-700"
                id="processBtn">
          Start Processing
        </button>
        <p id="processResult" class="text-sm text-gray-500 mt-2"></p>
      </section>

      <!-- Status & Polling -->
      <section class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold mb-4">4. Status</h2>
        <div class="flex gap-3 items-center">
          <button onclick="checkStatus()"
                  class="bg-gray-600 text-white px-4 py-2 rounded text-sm hover:bg-gray-700">
            Check Status
          </button>
          <span id="statusBadge" class="text-sm font-medium"></span>
        </div>
      </section>

      <!-- Results -->
      <section class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold mb-4">5. Results</h2>
        <button onclick="loadResults()"
                class="bg-indigo-600 text-white px-4 py-2 rounded text-sm hover:bg-indigo-700 mb-4">
          Load Results
        </button>
        <div id="results" class="space-y-4"></div>
      </section>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:3001/api";
    let currentMeetingId = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    // --- Meeting ---
    async function createMeeting() {
      const title = document.getElementById("meetingTitle").value || "Untitled";
      const res = await fetch(`${API_BASE}/meetings`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title }),
      });
      const json = await res.json();
      if (json.success) {
        currentMeetingId = json.data.id;
        document.getElementById("meetingResult").textContent =
          `✓ Created: "${json.data.title}" (ID: ${json.data.id})`;
      } else {
        document.getElementById("meetingResult").textContent = `✗ ${json.error}`;
      }
    }

    // --- Recording ---
    async function toggleRecording() {
      const btn = document.getElementById("recordBtn");
      const status = document.getElementById("recordingStatus");

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach((t) => t.stop());
            const blob = new Blob(audioChunks, { type: "audio/webm" });
            await sendAudio(blob);
          };

          mediaRecorder.start();
          isRecording = true;
          btn.textContent = "Stop Recording";
          btn.classList.remove("bg-red-600");
          btn.classList.add("bg-gray-600");
          status.textContent = "🔴 Recording...";
        } catch (err) {
          status.textContent = `✗ Error: ${err.message}`;
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.textContent = "Start Recording";
        btn.classList.remove("bg-gray-600");
        btn.classList.add("bg-red-600");
        status.textContent = "⏹ Recording saved";
      }
    }

    async function sendAudio(blob) {
      if (!currentMeetingId) {
        document.getElementById("audioResult").textContent =
          "✗ Create a meeting first";
        return;
      }
      const formData = new FormData();
      formData.append("audio", blob, "recording.webm");
      const res = await fetch(`${API_BASE}/meetings/${currentMeetingId}/audio`, {
        method: "POST",
        body: formData,
      });
      const json = await res.json();
      document.getElementById("audioResult").textContent = json.success
        ? "✓ Audio uploaded"
        : `✗ ${json.error}`;
    }

    // --- Upload file ---
    async function uploadAudio() {
      if (!currentMeetingId) {
        document.getElementById("audioResult").textContent = "✗ Create a meeting first";
        return;
      }
      const fileInput = document.getElementById("audioFile");
      if (!fileInput.files.length) {
        document.getElementById("audioResult").textContent = "✗ Select a file first";
        return;
      }
      const formData = new FormData();
      formData.append("audio", fileInput.files[0]);
      const res = await fetch(`${API_BASE}/meetings/${currentMeetingId}/audio`, {
        method: "POST",
        body: formData,
      });
      const json = await res.json();
      document.getElementById("audioResult").textContent = json.success
        ? "✓ Audio uploaded"
        : `✗ ${json.error}`;
    }

    // --- Process ---
    async function processMeeting() {
      if (!currentMeetingId) {
        document.getElementById("processResult").textContent = "✗ Create a meeting first";
        return;
      }
      document.getElementById("processResult").textContent = "⏳ Processing...";
      const res = await fetch(
        `${API_BASE}/meetings/${currentMeetingId}/process`,
        { method: "POST" }
      );
      const json = await res.json();
      document.getElementById("processResult").textContent = json.success
        ? "✓ Processing started — check status in a few seconds"
        : `✗ ${json.error}`;
    }

    // --- Status ---
    async function checkStatus() {
      if (!currentMeetingId) {
        document.getElementById("statusBadge").textContent = "No meeting selected";
        return;
      }
      const res = await fetch(`${API_BASE}/meetings/${currentMeetingId}`);
      const json = await res.json();
      if (json.success) {
        const status = json.data.status;
        const colors = {
          pending: "text-gray-500",
          uploading: "text-blue-500",
          transcribing: "text-yellow-500",
          summarizing: "text-purple-500",
          complete: "text-green-500 font-bold",
          error: "text-red-500 font-bold",
        };
        document.getElementById("statusBadge").className =
          (colors[status] || "text-gray-500") + " text-lg";
        document.getElementById("statusBadge").textContent =
          status.charAt(0).toUpperCase() + status.slice(1);
      }
    }

    // --- Results ---
    async function loadResults() {
      if (!currentMeetingId) {
        document.getElementById("results").innerHTML =
          '<p class="text-red-500">Create a meeting first</p>';
        return;
      }
      const res = await fetch(`${API_BASE}/meetings/${currentMeetingId}`);
      const json = await res.json();
      const container = document.getElementById("results");

      if (!json.success) {
        container.innerHTML = `<p class="text-red-500">${json.error}</p>`;
        return;
      }

      const m = json.data;
      let html = "";

      // Transcript
      html += `<div class="border rounded p-4">
        <h3 class="font-semibold mb-2">Transcript</h3>
        <pre class="text-sm text-gray-700 whitespace-pre-wrap">${
          m.transcript || "(No transcript yet — process the meeting first)"
        }</pre>
      </div>`;

      // Summary
      if (m.summary) {
        html += `<div class="border rounded p-4">
          <h3 class="font-semibold mb-2">Summary</h3>
          <div class="text-sm text-gray-700 whitespace-pre-wrap">${m.summary}</div>
        </div>`;
      }

      // Bullet Points
      if (m.bulletPoints && m.bulletPoints.length) {
        html += `<div class="border rounded p-4">
          <h3 class="font-semibold mb-2">Bullet Points</h3>
          <ul class="list-disc pl-5 text-sm text-gray-700">`;
        m.bulletPoints.forEach((bp) => {
          html += `<li>${bp}</li>`;
        });
        html += `</ul></div>`;
      }

      // Topics
      if (m.topics && m.topics.length) {
        html += `<div class="border rounded p-4">
          <h3 class="font-semibold mb-2">Marketing Topics</h3>
          <div class="flex flex-wrap gap-2">`;
        m.topics.forEach((t) => {
          html += `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">${t}</span>`;
        });
        html += `</div></div>`;
      }

      // Tasks
      if (m.tasks && m.tasks.length) {
        html += `<div class="border rounded p-4">
          <h3 class="font-semibold mb-2">Tasks</h3>
          <ul class="space-y-1 text-sm">`;
        m.tasks.forEach((t) => {
          html += `<li class="flex items-center gap-2">
            <input type="checkbox" ${t.status === "done" ? "checked" : ""} disabled />
            <span>${t.description}</span>
            ${t.priority ? `<span class="text-xs px-1.5 py-0.5 rounded ${
              t.priority === "high" ? "bg-red-100 text-red-700" :
              t.priority === "medium" ? "bg-yellow-100 text-yellow-700" :
              "bg-gray-100 text-gray-700"
            }">${t.priority}</span>` : ""}
            ${t.assignee ? `<span class="text-gray-400">@${t.assignee}</span>` : ""}
          </li>`;
        });
        html += `</ul></div>`;
      }

      container.innerHTML = html;
    }
  </script>
</body>
</html>
