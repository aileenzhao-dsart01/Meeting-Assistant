services:
  - type: web
    name: meeting-assistant-api
    runtime: node
    repo: https://github.com/aileenzhao-dsart01/Meeting-Assistant
    plan: free
    region: oregon
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"

      # ── Required — must be set manually ──
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # ── Required for Supabase Storage (optional for local storage) ──
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── Derived from SUPABASE_URL — OVERRIDE only if different JWKS endpoint needed ──
      # SUPABASE_JWKS_URL: https://<project>.supabase.co/auth/v1/.well-known/jwks.json
      # SUPABASE_PROJECT_REF: <project-ref> (auto-derived from SUPABASE_URL subdomain)

      # ── Required for speech transcription ──
      - key: STT_PROVIDER
        value: deepgram
      - key: DEEPGRAM_API_KEY
        sync: false

      # ── Optional overrides (sensible defaults) ──
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: LLM_PROVIDER
        value: deepseek
      - key: STT_DEEPGRAM_MODEL
        value: nova-3
      - key: DEEPGRAM_FILTER_FILLER
        value: "true"
      - key: WHISPER_LANGUAGE
        value: en
      - key: AUDIO_STORAGE_PATH
        value: ./audio
      - key: AUDIO_CLARITY_MODE
        value: speech
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: meeting-audio
