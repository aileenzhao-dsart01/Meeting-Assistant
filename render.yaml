services:
  - type: web
    name: meeting-assistant-api
    runtime: node
    repo: https://github.com/aileenzhao-dsart01/Meeting-Assistant
    plan: free
    region: oregon
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: LLM_PROVIDER
        value: deepseek
      - key: CORS_ORIGINS
        sync: false
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: WHISPER_LANGUAGE
        value: en
      - key: WHISPER_VAD_FILTER
        value: "true"
      - key: WHISPER_VAD_THRESHOLD
        value: "0.4"
      - key: AUDIO_STORAGE_PATH
        value: ./audio
